# Default: the runner HAS internet access (network egress) and a shell with no credentials. It cannot reach the app's
# secrets. To cut it off, remove "egress" from the runner's networks below. See docs/DESIGN.md and SECURITY.md.
name: pi-durable-web

services:
  app:
    build:
      context: .
      target: app
      args: { APP_UID: "${HOST_UID:-1000}", APP_GID: "${HOST_GID:-1000}" }
    image: pi-durable-web-app:local
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      RUNNER_URL: http://runner:7000
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      APP_TOKEN_FILE: /run/secrets/app_token
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [anthropic_api_key, app_token, runner_token, master_key]
    volumes: ["app-data:/data"]
    # Listens on all host interfaces by default (LAN access). Set APP_BIND=127.0.0.1 to keep it local only.
    ports: ["${APP_BIND:-0.0.0.0}:8787:8787"]
    networks: [edge, tools]
    depends_on:
      runner: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  runner:
    build:
      context: .
      target: runner
      args: { APP_UID: "${HOST_UID:-1000}", APP_GID: "${HOST_GID:-1000}" }
    image: pi-durable-web-runner:local
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "7000"
      WORKSPACE_DIR: /workspace
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
    secrets: [runner_token]
    volumes: ["workspace:/workspace"]
    networks: [tools, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge: {}                 # normal bridge: app reaches api.anthropic.com
  tools: { internal: true } # no route to the outside world: app <-> runner only
  egress: {}                # normal bridge: the runner reaches the internet

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  app_token:
    file: ./secrets/app_token
  runner_token:
    file: ./secrets/runner_token
  master_key:
    file: ./secrets/master_key

volumes:
  app-data: {}
  workspace: {}
