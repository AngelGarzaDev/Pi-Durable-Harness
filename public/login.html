<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Durable · Sign in</title>
<style>
:root { color-scheme: dark; --bg: #16181d; --panel: #1e2128; --border: #343844; --text: #e4e6eb; --muted: #8b90a0; --error: #f28b82; }
body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); }
form { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; width: min(24rem, 90vw); display: grid; gap: .75rem; }
h1 { font-size: 1.2rem; margin: 0; }
input { padding: .5rem; font-size: 1rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
button { padding: .5rem; font-size: 1rem; background: #2d3340; color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
button:hover { background: #3a4150; }
#msg { color: var(--muted); font-size: .9rem; min-height: 1.2em; margin: 0; }
#msg.error { color: var(--error); }
</style>
<form id="f" autocomplete="off">
  <h1>Pi Durable</h1>
  <input id="token" type="password" placeholder="Access token" autofocus required>
  <button>Sign in</button>
  <p id="msg"></p>
</form>
<script src="login.js"></script>
